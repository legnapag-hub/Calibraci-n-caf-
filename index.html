<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calibración de Café</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f5c4d">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#edf0ec;--card:#fbfcfa;--ink:#1c2622;--mut:#5f6f68;--acc:#1f5c4d;--onacc:#fff;--crema:#b9791f;--ok:#237a4a;--warn:#a86a00;--bad:#b13a2e;--line:#d3dad4;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#131917;--card:#1b2320;--ink:#e7eee9;--mut:#93a49b;--acc:#5fb59d;--onacc:#0d1512;--crema:#e0a548;--ok:#5fcf93;--warn:#e8b24a;--bad:#f07a6c;--line:#2d3833}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0px)}
header{padding:14px 16px 10px;max-width:760px;margin:auto}
h1{font:600 1.35rem Georgia,"Iowan Old Style",serif;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font:600 1.15rem Georgia,serif;margin:4px 0 12px}
.hd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
main{max-width:760px;margin:auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
label{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:4px}
input,select,textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.res{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px}
.chip{background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--crema);border-radius:8px;padding:6px 12px;font:600 1.25rem Georgia,serif;display:flex;flex-direction:column}
.chip small{font:500 .72rem system-ui;color:var(--mut)}
.chip.ok{border-left-color:var(--ok)}.chip.warn{border-left-color:var(--warn)}.chip.bad{border-left-color:var(--bad)}
.hint{flex-basis:100%;margin:2px 0;font-size:.9rem}.hint.bad{color:var(--bad)}.hint.ok{color:var(--ok)}.hint.warn{color:var(--warn)}
button{font:inherit;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600;width:100%;margin-top:10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{flex:1 0 74px;border:0;background:none;font-size:.72rem;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:0;padding:4px}
nav button span{font-size:1.3rem}nav button.on{color:var(--acc);font-weight:700}
.log{border-bottom:1px solid var(--line);padding:10px 0;font-size:.9rem}.log b{font-family:Georgia,serif}
.log .r{display:flex;justify-content:space-between;gap:8px;color:var(--mut)}
details{border-bottom:1px solid var(--line);padding:10px 0}summary{font-weight:600;cursor:pointer}details p{margin:8px 0 0;color:var(--mut)}
.row{display:flex;gap:8px}.row button{flex:1}
.qk{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.qk button{min-height:34px;padding:2px 11px;font-size:.82rem;border-radius:16px}.qk button.on{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
#t{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
#t.on{opacity:1}
@media(max-width:480px){.hd{grid-template-columns:1fr 1fr}.hd label:first-child{grid-column:1/3}}
</style></head><body>
<header><h1><span>Calibración de café</span><button id="ins" hidden>Instalar</button></h1>
<div class="hd">
<label>Fecha<input type="date" id="h-fecha"></label>
<label>Origen / café<input id="h-origen" placeholder="Ej. Huila, Colombia"></label>
<label>Molino<input id="h-molino" placeholder="Shardor / otro"></label></div></header>
<main id="m"></main><nav id="nav"></nav><div id="t"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),N=x=>parseFloat(String(x??'').replace(',','.'))||0,f1=x=>String(Math.round(x*10)/10);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
let S=ld('cal',{}),LOG=ld('log',[]);
S.h=Object.assign({origen:'',molino:'Shardor'},S.h);S.h.fecha=new Date().toISOString().slice(0,10);
const CFGDEF={eyLo:18,eyHi:22,tLo:22,tHi:35,cbLo:17,cbHi:21,mAmb:65,mRed:70};S.cfg=Object.assign({},CFGDEF,S.cfg);
const FB={wa:'',mail:''};
const ey=(v,lo,hi,u,o)=>v?{chips:[['EY',f1(v)+'%',v<lo||v>hi?'bad':'ok']],hint:v<lo?u:v>hi?o:'Dentro del rango ideal ('+lo+'–'+hi+'%).',hs:v<lo||v>hi?'bad':'ok'}:{chips:[]};
const SEC={
espresso:{t:'Espresso',met:v=>v.tipo||'Espresso',f:[['tipo','Tipo','s',['Espresso Sencillo','Espresso Doble']],['in','Dosis In (g)','n'],['out','Salida Out (g)','n'],['seg','Tiempo (seg)','n'],['mol','Molienda (clic)','n'],['tds','TDS (%)','n'],['dulce','Dulce (1-5)','r'],['amargo','Amargo (1-5)','r'],['acido','Ácido (1-5)','r'],['cuerpo','Cuerpo','s',['Ligero','Sedoso','Pesado']],['desc','Descriptores final / retrogusto','t']],
 calc(v){const i=N(v.in),r=i?N(v.out)/i:0,e=i&&N(v.tds)?N(v.out)*N(v.tds)/i:0,x=ey(e,S.cfg.eyLo,S.cfg.eyHi,'Subextracción: muele más fino (ej. 7 → 6).','Sobreextracción: muele más grueso (ej. 7 → 8).');
  const s=N(v.seg);if(r)x.chips.unshift(['Ratio','1:'+f1(r)]);if(s)x.chips.push(['Tiempo',s+' s',s<S.cfg.tLo||s>S.cfg.tHi?'warn':'ok']);if(!x.hint&&s){x.hint=s<S.cfg.tLo?'Extracción rápida: prueba una molienda más fina.':s>S.cfg.tHi?'Extracción lenta: prueba una molienda más gruesa.':'Tiempo dentro del rango típico ('+S.cfg.tLo+'–'+S.cfg.tHi+' s).';x.hs=s<S.cfg.tLo||s>S.cfg.tHi?'warn':'ok'}x.ratio=r?'1:'+f1(r):'';x.ey=e;return x}},
leche:{t:'Leche (capuccino)',met:()=>'Capuccino',def:{ml:150,temp:60},f:[['ml','Leche (ml)','n'],['temp','Temp. emulsión (°C)','n'],['tex','Textura / microespuma','s',['Brillo sedoso','Cremoso','Burbujas grandes']],['dulz','Dulzor lácteo (1-5)','r'],['bal','Balance café/leche','s',['Equilibrado','Muy lácteo','Muy café']],['desc','Descriptor final','t']],
 calc(v){const t=N(v.temp),x={chips:[],out:v.ml};if(t){const lv=t>S.cfg.mRed?'bad':t>S.cfg.mAmb?'warn':'ok';x.chips.push(['Temp.',f1(t)+'°C',lv]);x.hint=lv=='bad'?'Sobre '+S.cfg.mRed+'°C: la leche se quema, pierde dulzor y sabe rancia.':lv=='warn'?'Entre '+S.cfg.mAmb+' y '+S.cfg.mRed+'°C: aceptable, pero sin margen. Ideal 60–65°C.':'Temperatura correcta (ideal 60–65°C).';x.hs=lv}return x}},
filtrado:{t:'Filtrado neo-tradicional',met:()=>'Filtrado',def:{in:18,agua:200,bypass:30,n:3},f:[['in','Dosis In (g)','n'],['agua','Agua en vertidos (g)','n'],['bypass','Bypass (g)','n'],['n','N° de vertidos','n'],['lily','Lilydrip','s',['Sí','No']],['ret','Retención (seg)','t'],['desc','Evaluación final','t']],
 calc(v){const i=N(v.in),tot=N(v.agua)+N(v.bypass),x={chips:[],out:tot||''};if(tot)x.chips.push(['Líquido total',f1(tot)+' g']);if(i&&tot){x.ratio='1:'+f1(tot/i);x.chips.push(['Ratio',x.ratio])}return x}},
sim:{t:'Simulador de ratios',nosave:1,def:{modo:'Tengo el café (g)',ratio:15,in:15,agua:250,bypass:30},f:[['modo','Calcular a partir de','s',['Tengo el café (g)','Tengo el agua (g)']],['ratio','Ratio objetivo (1:X)','n'],['in','Café disponible (g)','n'],['agua','Agua disponible (g)','n'],['bypass','Bypass (g)','n']],
 calc(v){const r=N(v.ratio),A=v.modo=='Tengo el agua (g)';if(!r)return{chips:[]};const w=A?N(v.agua):r*N(v.in),d=A?w/r:N(v.in),b=N(v.bypass);
  return{chips:[['Café',f1(d)+' g','ok'],['Agua total',f1(w)+' g','ok'],['En vertidos',f1(w-b)+' g'],['Bypass',f1(b)+' g']]}}},
cold:{t:'Cold brew',met:()=>'Cold Brew',def:{in:200,agua:2000,h:18},f:[['in','Dosis café (g)','n'],['agua','Agua In (g)','n'],['h','Tiempo (horas)','n'],['temp','Temperatura','s',['Refrigeración','Ambiente']],['tds','TDS (%)','n'],['out','Rendimiento líquido (g)','n'],['desc','Descriptores final / retrogusto','t']],
 calc(v){const i=N(v.in),r=i?N(v.agua)/i:0,e=i&&N(v.tds)?N(v.out)*N(v.tds)/i:0,x=ey(e,S.cfg.cbLo,S.cfg.cbHi,'Subextracción: +2–4 h, molienda algo más fina y agita al inicio.','Sobreextracción: menos horas (24 → 18), molienda más gruesa o refrigera.');
  if(r)x.chips.unshift(['Ratio','1:'+Math.round(r)]);x.ratio=r?'1:'+Math.round(r):'';x.ey=e;return x}}};
const TABS=[['espresso','☕','Espresso'],['leche','🥛','Leche'],['filtrado','🫖','Filtrado'],['sim','🎛️','Simulador'],['cold','🧊','Cold brew'],['log','📋','Registro'],['guia','📖','Guía'],['cfg','⚙️','Ajustes']];
const GUIA=[['Cómo usar','Escribe solo en los campos; ratio y EY se calculan solos. Toca «Guardar en registro» para archivar la preparación. El EY ideal de espresso es 18–22%.'],
['Subextracción (agrio, salado, metálico)','EY menor a 18% o menos de 22 s en doble. Cierra la molienda (más fina): de 7 a 6 o 5.5. Las partículas más juntas frenan el agua y suben la extracción.'],
['Sobreextracción (amargo, seco, astringente)','EY mayor a 22% o más de 32–35 s. Abre la molienda (más gruesa): de 7 a 8 u 8.5 para que el agua fluya más rápido.'],
['Canalización (amargo y agrio a la vez)','Tiempo rápido (ej. 18 s) pero sabor mezclado. Distribuye el café plano, da golpecitos secos a los lados del porta-filtro y compacta con el tamper nivelado.'],
['Fallas con la leche','Sobre 65–70°C empieza a saber rancio o quemado: detén cuando la jarra empiece a quemar la mano. Efecto «isla»: mete aire solo los primeros 3 s, luego sumerge la lanceta 1 cm y haz un vórtice.'],
['Cold brew','EY mayor a 21% (amargo, medicinal): menos tiempo, molienda más gruesa o refrigerar. EY menor a 17% (acuoso, agrio): +2–4 h, molienda algo más fina y agitar al inicio.'],
['Glosario del final','Buscamos: Prolongado, Limpio, Malteado/Toffee. Defectos: Seco/Astringente (sobreextraído), Agrio/Metálico (subextraído), Rancio/Quemado (leche a más de 65°C).']];
const QK={espresso:['Limpio','Dulce','Chocolate','Caramelo','Frutal','Cítrico','Floral','Prolongado','Seco','Astringente','Agrio','Metálico','Amargo'],leche:['Malteado','Toffee','Cremoso','Dulce','Rancio','Quemado','Aguado'],filtrado:['Cuerpo tipo té','Final florido','Frutal','Dulce','Limpio','Acidez brillante','Astringente'],cold:['Limpio','Dulce','Chocolate','Frutal','Maderoso','Medicinal','Acuoso','Agrio']};
const fld=(id,[k,l,t,o])=>{const v=(S[id]||{})[k]??'';const i=t=='s'||t=='r'?`<select data-k="${k}"><option value="">—</option>${(t=='r'?['1','2','3','4','5']:o).map(x=>`<option${x==v?' selected':''}>${x}</option>`).join('')}</select>`:`<input data-k="${k}" value="${esc(v)}" ${t=='n'?'type="number" inputmode="decimal" step="any"':'type="text"'}>`;return`<label>${l}${i}</label>`};
const CFG=[['eyLo','EY mínimo espresso (%)','n'],['eyHi','EY máximo espresso (%)','n'],['tLo','Tiempo mínimo espresso (s)','n'],['tHi','Tiempo máximo espresso (s)','n'],['cbLo','EY mínimo cold brew (%)','n'],['cbHi','EY máximo cold brew (%)','n'],['mAmb','Leche: aviso desde (°C)','n'],['mRed','Leche: alerta desde (°C)','n']];
const CFGHTML='<section id="p-cfg" data-id="cfg" hidden><h2>Ajustes: rangos de referencia</h2><div class="g">'+CFG.map(x=>fld('cfg',x)).join('')+'</div><p class="hint">Son referencias, no reglas: 18–22 % es el rango clásico de EY y hoy hay quien extrae más alto. Los valores de cold brew están por validar.</p><button data-act="cfgreset" style="width:100%">Restablecer valores</button></section>';
const FBHTML='<h2 style="margin-top:18px">Enviar comentarios</h2><label>Tu mensaje<textarea id="fbt" rows="4" placeholder="¿Qué te gustó, qué falta, qué cambiarías?"></textarea></label><div class="row" style="margin-top:8px"><button class="pri" style="margin:0" data-act="fbw">WhatsApp</button><button data-act="fbm">Correo</button></div>';
const m=$('#m');
m.innerHTML=Object.entries(SEC).map(([id,d])=>{S[id]=Object.assign({},d.def,S[id]);return`<section id="p-${id}" data-id="${id}" hidden><h2>${d.t}</h2><div class="g">${d.f.map(x=>fld(id,x)).join('')}</div>${id=='espresso'?'<div class="row" style="margin-top:12px"><button data-act="tm">⏱ Cronómetro</button><output id="tmo" style="align-self:center;font:600 1.2rem Georgia,serif;flex:1;text-align:center">0.0 s</output></div>':''}${QK[id]?`<div class="qk">${QK[id].map(x=>`<button data-q="${x}"${(S[id].desc||'').split(', ').includes(x)?' class="on"':''}>${x}</button>`).join('')}</div>`:''}<div class="res" id="r-${id}"></div>${d.nosave?'':`<button class="pri" data-save="${id}">Guardar en registro</button>`}<button data-reset="${id}" style="width:100%;margin-top:8px">Limpiar campos</button></section>`}).join('')+'<section id="p-log" hidden></section>'+CFGHTML+'<section id="p-guia" hidden><h2>Guía y solución de problemas</h2>'+GUIA.map(([a,b])=>`<details><summary>${a}</summary><p>${b}</p></details>`).join('')+FBHTML+'</section>';
$('#nav').innerHTML=TABS.map(([id,i,l])=>`<button data-tab="${id}"><span>${i}</span>${l}</button>`).join('');
const upd=id=>{const d=SEC[id],c=d.calc(S[id]);$('#r-'+id).innerHTML=c.chips.map(([l,x,s])=>`<div class="chip ${s||''}"><small>${l}</small>${x}</div>`).join('')+(c.hint?`<p class="hint ${c.hs||''}">${c.hint}</p>`:'');return c};
const toast=s=>{const t=$('#t');t.textContent=s;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1600)};
const sm=()=>{const y=LOG.map(e=>N(e.e)).filter(Boolean);return`<p style="color:var(--mut);margin:0 0 8px">${LOG.length} preparaciones${y.length?' · EY promedio '+f1(y.reduce((a,b)=>a+b,0)/y.length)+'%':''}</p>`};
function rlog(){$('#p-log').innerHTML='<h2>Registro</h2>'+sm()+(LOG.length?LOG.slice().reverse().map((e,j)=>`<div class="log"><div class="r"><span>${e.f} · ${esc(e.o||'—')}</span><button data-del="${LOG.length-1-j}" aria-label="Eliminar">✕</button></div><b>${esc(e.m)}</b> · ${esc(e.mo||'')}<br>${e.i?e.i+' g → ':''}${e.out?e.out+(e.m=='Capuccino'?' ml':' g'):''} ${e.r?'· '+e.r:''} ${e.t?'· TDS '+e.t+'%':''} ${e.e?'· EY '+e.e:''}<br><span style="color:var(--mut)">${esc(e.d||'')}</span></div>`).join(''):'<p style="color:var(--mut)">Aún no hay preparaciones. Guarda la primera desde cualquier sección.</p>')+'<div class="row" style="margin-top:14px"><button data-act="csv">Exportar CSV</button><button data-act="clr">Borrar todo</button></div><div class="row" style="margin-top:8px"><button data-act="json">Respaldar (JSON)</button><button data-act="imp">Importar respaldo</button></div><input type="file" id="fi" accept=".json,application/json" hidden>'}
function show(id){document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!='p-'+id);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==id));if(id=='log')rlog();scrollTo(0,0);sv('tab',id)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.tab)};
m.addEventListener('input',e=>{const p=e.target.closest('section[data-id]'),k=e.target.dataset.k;if(!p||!k)return;const id=p.dataset.id;if(id=='cfg'){const n=parseFloat(e.target.value);if(isNaN(n))return;S.cfg[k]=n;sv('cal',S);Object.keys(SEC).forEach(upd);return}S[id][k]=e.target.value;if(id=='espresso'&&k=='tipo'){const d=e.target.value.includes('Doble')?[18,38]:[9,21];S[id].in=d[0];S[id].out=d[1];p.querySelector('[data-k=in]').value=d[0];p.querySelector('[data-k=out]').value=d[1]}sv('cal',S);upd(id)});
m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.save){const id=d.save,c=upd(id),v=S[id];LOG.push({f:S.h.fecha,o:S.h.origen,m:SEC[id].met(v),mo:S.h.molino,i:v.in||'',out:c.out??v.out??'',r:c.ratio||'',t:v.tds||'',e:c.ey?f1(c.ey)+'%':'',d:v.desc||''});sv('log',LOG);toast('Guardado en el registro')}
if(d.q){const p=b.closest('section'),id=p.dataset.id,i=p.querySelector('[data-k=desc]'),a=i.value.split(', ').filter(Boolean),j=a.indexOf(d.q);j<0?a.push(d.q):a.splice(j,1);i.value=a.join(', ');S[id].desc=i.value;b.classList.toggle('on',j<0);sv('cal',S)}
if(d.reset){const id=d.reset,p=b.closest('section');S[id]=Object.assign({},SEC[id].def);p.querySelectorAll('[data-k]').forEach(i=>i.value=S[id][i.dataset.k]??'');p.querySelectorAll('.qk .on').forEach(x=>x.classList.remove('on'));sv('cal',S);upd(id)}
if(d.act=='tm')tm(b);
if(d.act=='json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({log:LOG,cal:S})],{type:'application/json'}));a.download='respaldo-calibracion.json';a.click()}
if(d.act=='imp')$('#fi').click();
if(d.act=='cfgreset'){S.cfg=Object.assign({},CFGDEF);document.querySelectorAll('#p-cfg [data-k]').forEach(i=>i.value=S.cfg[i.dataset.k]);sv('cal',S);Object.keys(SEC).forEach(upd);toast('Valores restablecidos')}
if(d.act=='fbw'||d.act=='fbm'){const t=$('#fbt').value.trim();if(!t){toast('Escribe un comentario primero');return}const q=encodeURIComponent('Comentarios sobre Calibración de Café:\n'+t);if(d.act=='fbw')open('https://wa.me/'+FB.wa+'?text='+q,'_blank');else location.href='mailto:'+FB.mail+'?subject='+encodeURIComponent('Comentarios: Calibración de Café')+'&body='+q}
if(d.del){LOG.splice(+d.del,1);sv('log',LOG);rlog()}
if(d.act=='clr'&&LOG.length&&confirm('¿Borrar todo el registro?')){LOG=[];sv('log',LOG);rlog()}
if(d.act=='csv'){const q=x=>'"'+String(x).replace(/"/g,'""')+'"',rows=[['Fecha','Café/Origen','Método/Bebida','Molino','Dosis In (g)','Salida Out (g)','Ratio','TDS%','EY%','Descriptor del final'],...LOG.map(e=>[e.f,e.o,e.m,e.mo,e.i,e.out,e.r,e.t,e.e,e.d])],a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='registro-calibracion.csv';a.click()}});
let T=null,t0=0;
