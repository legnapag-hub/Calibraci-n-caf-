function rlog(){$('#p-log').innerHTML='<h2>Registro</h2>'+sm()+(LOG.length?LOG.slice().reverse().map((e,j)=>`<div class="log"><div class="r"><span>${e.f} · ${esc(e.o||'—')}</span><button data-del="${LOG.length-1-j}" aria-label="Eliminar">✕</button></div><b>${esc(e.m)}</b> · ${esc(e.mo||'')}${e.b?' · 👤 '+esc(e.b):''}<br>${e.i?e.i+' g → ':''}${e.out?e.out+(e.m=='Capuccino'?' ml':' g'):''} ${e.r?'· '+e.r:''} ${e.t?'· TDS '+e.t+'%':''} ${e.e?'· EY '+e.e:''}<br><span style="color:var(--mut)">${esc(e.d||'')}</span></div>`).join(''):'<p style="color:var(--mut)">Aún no hay preparaciones. Guarda la primera desde cualquier sección.</p>')+'<div class="row" style="margin-top:14px"><button data-act="csv">Exportar CSV</button><button data-act="clr">Borrar todo</button></div><div class="row" style="margin-top:8px"><button data-act="json">Respaldar (JSON)</button><button data-act="imp">Importar respaldo</button></div><input type="file" id="fi" accept=".json,application/json" hidden>'}
function show(id){document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!='p-'+id);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab==id));if(id=='log')rlog();scrollTo(0,0);sv('tab',id)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.tab)};
m.addEventListener('input',e=>{const p=e.target.closest('section[data-id]'),k=e.target.dataset.k;if(!p||!k)return;const id=p.dataset.id;if(id=='cfg'){const n=parseFloat(e.target.value);if(isNaN(n))return;S.cfg[k]=n;sv('cal',S);Object.keys(SEC).forEach(upd);return}S[id][k]=e.target.value;if(id=='espresso'&&k=='tipo'){const d=e.target.value.includes('Doble')?[18,38]:[9,21];S[id].in=d[0];S[id].out=d[1];[['in',d[0]],['out',d[1]]].forEach(([k2,v2])=>{const el=p.querySelector('[data-k='+k2+']');if(el)el.value=v2})}sv('cal',S);upd(id)});
m.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.save){const id=d.save,c=upd(id),v=S[id];LOG.push({f:S.h.fecha,b:S.h.barista||'',o:S.h.origen,m:SEC[id].met(v),mo:S.h.molino,i:v.in||'',out:c.out??v.out??'',r:c.ratio||'',t:v.tds||'',e:c.ey?f1(c.ey)+'%':'',d:[v.sabor,v.seg?v.seg+' s':'',v.h?v.h+' h':'',v.mol?'molienda '+v.mol:'',v.vueltas?'vueltas '+v.vueltas:'',v.desc].filter(Boolean).join(' · ')});sv('log',LOG);toast('Guardado en el registro')}
if(d.q){const p=b.closest('section'),id=p.dataset.id,i=p.querySelector('[data-k=desc]'),a=i.value.split(', ').filter(Boolean),j=a.indexOf(d.q);j<0?a.push(d.q):a.splice(j,1);i.value=a.join(', ');S[id].desc=i.value;b.classList.toggle('on',j<0);sv('cal',S)}
if(d.reset){const id=d.reset,p=b.closest('section');S[id]=Object.assign({},SEC[id].def);p.querySelectorAll('[data-k]').forEach(i=>i.value=S[id][i.dataset.k]??'');p.querySelectorAll('.qk .on').forEach(x=>x.classList.remove('on'));if(id=='filtrado')fsw('tr');sv('cal',S);upd(id)}
if(d.act=='tm')tm(b);
if(['tf','tl','tr'].includes(d.act))fsw(d.act);
if(d.act=='json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({log:LOG,cal:S})],{type:'application/json'}));a.download='respaldo-calibracion.json';a.click()}
if(d.act=='imp')$('#fi').click();
if(d.act=='modo'){S.mode=d.m;sv('cal',S);location.reload()}
if(d.act=='cfgreset'){S.cfg=Object.assign({},CFGDEF);document.querySelectorAll('#p-cfg [data-k]').forEach(i=>i.value=S.cfg[i.dataset.k]);sv('cal',S);Object.keys(SEC).forEach(upd);toast('Valores restablecidos')}
if(d.act=='fbw'||d.act=='fbm'){const t=$('#fbt').value.trim();if(!t){toast('Escribe un comentario primero');return}const q=encodeURIComponent('Comentarios sobre Afina:\n'+t);if(d.act=='fbw')open('https://wa.me/'+FB.wa+'?text='+q,'_blank');else location.href='mailto:'+FB.mail+'?subject='+encodeURIComponent('Comentarios sobre Afina')+'&body='+q}
if(d.del){LOG.splice(+d.del,1);sv('log',LOG);rlog()}
if(d.act=='clr'&&LOG.length&&confirm('¿Borrar todo el registro?')){LOG=[];sv('log',LOG);rlog()}
if(d.act=='csv'){const q=x=>'"'+String(x).replace(/"/g,'""')+'"',rows=[['Fecha','Barista','Café/Origen','Método/Bebida','Molino','Dosis In (g)','Salida Out (g)','Ratio','TDS%','EY%','Descriptor del final'],...LOG.map(e=>[e.f,e.b||'',e.o,e.m,e.mo,e.i,e.out,e.r,e.t,e.e,e.d])],a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='registro-calibracion.csv';a.click()}});
const fm=ms=>{const s=ms/1000;return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0')};
let F={t0:0,acc:0,run:false,laps:[],iv:null,wl:null};
const fe=()=>F.acc+(F.run?Date.now()-F.t0:0);
function fsw(a){const o=$('#tmf'),L=$('#lapf'),b=$('[data-act=tf]'),sg=$('#p-filtrado [data-k=seg]');
if(a=='tf'){if(F.run){F.acc+=Date.now()-F.t0;F.run=false;clearInterval(F.iv);F.wl&&F.wl.release();b.textContent='▶ Reanudar';o.textContent=fm(F.acc);const q=Math.round(F.acc/1000);S.filtrado.seg=q;if(sg)sg.value=q;sv('cal',S);upd('filtrado')}else{F.t0=Date.now();F.run=true;F.iv=setInterval(()=>o.textContent=fm(fe()),100);b.textContent='⏹ Detener';try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>F.wl=w).catch(()=>{})}catch(e){}}}
else if(a=='tl'){if(F.run||F.acc){F.laps.push(fe());L.innerHTML=F.laps.map((x,i)=>`<li>${fm(x)}${i?' (+'+fm(x-F.laps[i-1])+')':''}</li>`).join('');S.filtrado.vueltas=F.laps.map(x=>fm(x).slice(0,-2)).join(' · ');sv('cal',S)}}
else{clearInterval(F.iv);F.wl&&F.wl.release();F={t0:0,acc:0,run:false,laps:[],iv:null,wl:null};o.textContent='0:00.0';b.textContent='▶ Iniciar';L.innerHTML='';S.filtrado.vueltas='';S.filtrado.seg='';if(sg)sg.value='';sv('cal',S);upd('filtrado')}}
let T=null,t0=0;
function tm(b){const i=$('#p-espresso [data-k=seg]');if(T){clearInterval(T);T=null;const q=Math.round((Date.now()-t0)/1000);S.espresso.seg=q;i.value=q;sv('cal',S);upd('espresso');b.textContent='⏱ Cronómetro'}else{t0=Date.now();T=setInterval(()=>$('#tmo').textContent=((Date.now()-t0)/1000).toFixed(1)+' s',100);b.textContent='⏹ Detener'}}
document.addEventListener('change',e=>{if(e.target.id!='fi')return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!Array.isArray(j.log))throw 0;LOG=LOG.concat(j.log);sv('log',LOG);rlog();toast('Respaldo importado')}catch(x){toast('Archivo no válido')}};r.readAsText(e.target.files[0])});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
['fecha','barista','origen','molino'].forEach(k=>{const i=$('#h-'+k);i.value=S.h[k];i.oninput=()=>{S.h[k]=i.value;sv('cal',S)}});
Object.keys(SEC).forEach(upd);show((t=>S.mode=='simple'&&['leche','sim'].includes(t)?'espresso':t)(ld('tab','espresso')));
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#ins').hidden=false});$('#ins').onclick=()=>dp&&dp.prompt();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
